name: Android Build

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK 36
        shell: bash
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      - name: Verify Environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed


      - name: Build AAR
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease


      - name: Find AAR
        shell: bash
        run: |
          echo "===== AAR FILES ====="
          find gameui/build/outputs -type f -name "*.aar" -print
          echo "====================="


      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: gameui-aar
          path: |
            gameui/build/outputs/aar/*.aar
          if-no-files-found: error